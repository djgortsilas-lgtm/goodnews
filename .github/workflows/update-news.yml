name: Ενημέρωση ειδήσεων

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and filter news
        run: node scripts/fetch-news.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/translation-cache.json
          if git diff --cached --quiet; then
            echo "Καμία αλλαγή στα δεδομένα."
          else
            git commit -m "chore: ενημέρωση ειδήσεων $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
